aid: cuseum
name: Cuseum
description: >-
  Cuseum is an engagement platform for museums, cultural attractions, nonprofits,
  and membership organizations. Its core product issues digital membership cards
  that members save to Apple Wallet and Google Wallet, replacing plastic cards with
  passes that update in real time and support tap-to-scan entry. Beyond membership,
  Cuseum offers mobile visitor guides, audio tours, guest passes, loyalty programs,
  donor engagement, and automated lifecycle communications. It syncs member and
  donor data with existing CRM, ticketing, and POS systems (Salesforce, HubSpot,
  Tessitura, Blackbaud, NeonCRM, PatronManager, ACME Ticketing, Ticketure) via
  CSV upload, SFTP, Zapier, and API-based integrations. Cuseum was part of the
  Techstars accelerator and serves cultural institutions worldwide.
